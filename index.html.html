
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TO DO LIST</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    padding: 30px 15px;

    background-image: url("newbackground.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    display: flex;
    justify-content: center;
    align-items: flex-start;
}

.container {
    width: 100%;
    max-width: 550px;

    margin-top: 30px;
    padding: 25px;

    background: rgba(255,255,255,0.92);

    border-radius: 25px;

    box-shadow: 0 10px 30px rgba(0,0,0,0.20);
}

h1 {
    text-align: center;

    color: #7b4b8a;

    margin-bottom: 25px;

    font-size: 30px;

    letter-spacing: 1px;
}


/* DATE */

.date-area {
    margin-bottom: 20px;
}

.date-area label {
    display: block;

    color: #4d3b52;

    margin-bottom: 8px;

    font-size: 16px;
}

#dateInput {
    width: 100%;

    padding: 12px;

    border: 2px solid #d9b8e5;

    border-radius: 12px;

    font-size: 16px;

    outline: none;
}


/* INPUT */

.input-area {
    display: flex;

    gap: 10px;

    margin-bottom: 20px;
}

#taskInput {
    flex: 1;

    padding: 13px;

    border: 2px solid #d9b8e5;

    border-radius: 12px;

    font-size: 16px;

    outline: none;
}

#addBtn {
    border: none;

    background: #9b62ad;

    color: white;

    padding: 0 20px;

    border-radius: 12px;

    font-size: 16px;

    cursor: pointer;
}

#addBtn:hover {
    background: #7b4b8a;
}


/* TASK */

#taskList {
    list-style: none;
}

.task {
    display: flex;

    align-items: center;

    gap: 10px;

    background: #fff7ff;

    border: 1px solid #ead4ef;

    border-radius: 14px;

    padding: 13px;

    margin-bottom: 10px;
}

.task input[type="checkbox"] {
    width: 22px;
    height: 22px;

    cursor: pointer;

    accent-color: #9b62ad;
}

.task-text {
    flex: 1;

    font-size: 17px;

    color: #4d3b52;

    overflow-wrap: anywhere;
}

.task.completed .task-text {
    text-decoration: line-through;

    opacity: 0.5;
}

.delete-btn {
    border: none;

    background: #f3a6b8;

    color: white;

    padding: 8px 12px;

    border-radius: 9px;

    cursor: pointer;
}

.delete-btn:hover {
    background: #e57f98;
}

.empty-message {
    text-align: center;

    color: #8b7092;

    padding: 20px 0 5px;
}


/* =========================
   CELEBRATION
   ========================= */

.celebration {
    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    display: flex;

    justify-content: center;
    align-items: center;

    background: rgba(255,255,255,0.25);

    backdrop-filter: blur(3px);

    z-index: 1000;

    animation: fadeIn 0.3s ease;
}

.celebration-box {
    width: 280px;

    padding: 30px 25px;

    text-align: center;

    background: white;

    border: 1px solid #ead4ef;

    border-radius: 24px;

    box-shadow: 0 15px 40px rgba(80,50,90,0.18);

    animation: popUp 0.4s ease;
}

.celebration-stars {
    font-size: 26px;

    color: #9b62ad;

    letter-spacing: 8px;

    margin-bottom: 12px;
}

.celebration-box h2 {
    color: #7b4b8a;

    font-size: 23px;

    margin-bottom: 8px;
}

.celebration-box p {
    color: #8b7092;

    font-size: 15px;
}


/* ANIMATIONS */

@keyframes fadeIn {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }

}

@keyframes popUp {

    from {
        opacity: 0;

        transform: scale(0.85);
    }

    to {
        opacity: 1;

        transform: scale(1);
    }

}

@media (max-width: 480px) {

    body {
        padding: 15px 10px;
    }

    .container {
        margin-top: 15px;

        padding: 18px;
    }

    h1 {
        font-size: 25px;
    }

    .celebration-box {
        width: 85%;
    }

}

</style>
</head>


<body>

<div class="container">

    <h1>TO DO LIST</h1>


    <div class="date-area">

        <label for="dateInput">
            Date
        </label>

        <input
            type="date"
            id="dateInput"
        >

    </div>


    <div class="input-area">

        <input
            type="text"
            id="taskInput"
            placeholder="Add a task..."
        >

        <button id="addBtn">
            Add
        </button>

    </div>


    <ul id="taskList"></ul>


    <p
        class="empty-message"
        id="emptyMessage"
    >
        No tasks yet
    </p>

</div>


<script>

const taskInput =
    document.getElementById("taskInput");

const addBtn =
    document.getElementById("addBtn");

const taskList =
    document.getElementById("taskList");

const emptyMessage =
    document.getElementById("emptyMessage");


/* EMPTY MESSAGE */

function updateEmptyMessage() {

    if (taskList.children.length === 0) {

        emptyMessage.style.display = "block";

    } else {

        emptyMessage.style.display = "none";

    }

}


/* CELEBRATION */

function celebrate() {

    const celebration =
        document.createElement("div");

    celebration.className =
        "celebration";

    celebration.innerHTML = `
    
        <div class="celebration-box">

            <div class="celebration-stars">
                ✦ ✧ ✦
            </div>

            <h2>
                Task Completed
            </h2>

            <p>
                Well done!
            </p>

        </div>
    
    `;

    document.body.appendChild(
        celebration
    );


    setTimeout(function() {

        celebration.style.opacity = "0";

        celebration.style.transition =
            "opacity 0.5s ease";

    }, 1500);


    setTimeout(function() {

        celebration.remove();

    }, 2000);

}


/* ADD TASK */

function addTask() {

    const taskText =
        taskInput.value.trim();


    if (taskText === "") {

        return;

    }


    const li =
        document.createElement("li");

    li.className =
        "task";


    /* CHECKBOX */

    const checkbox =
        document.createElement("input");

    checkbox.type =
        "checkbox";


    /* TEXT */

    const text =
        document.createElement("span");

    text.className =
        "task-text";

    text.textContent =
        taskText;


    /* DELETE */

    const deleteBtn =
        document.createElement("button");

    deleteBtn.className =
        "delete-btn";

    deleteBtn.textContent =
        "Delete";


    /* CHECK */

    checkbox.addEventListener(
        "change",
        function() {

            if (checkbox.checked) {

                li.classList.add(
                    "completed"
                );

                celebrate();

            } else {

                li.classList.remove(
                    "completed"
                );

            }

        }
    );


    /* DELETE */

    deleteBtn.addEventListener(
        "click",
        function() {

            li.remove();

            updateEmptyMessage();

        }
    );


    li.appendChild(checkbox);

    li.appendChild(text);

    li.appendChild(deleteBtn);

    taskList.appendChild(li);


    taskInput.value = "";

    taskInput.focus();

    updateEmptyMessage();

}


/* BUTTON */

addBtn.addEventListener(
    "click",
    addTask
);


/* ENTER */

taskInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            addTask();

        }

    }
);


updateEmptyMessage();

</script>

</body>

</html>
