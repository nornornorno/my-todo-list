<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#e98fa8">
<link rel="manifest" href="manifest.json">
<title>TO-DO LIST</title>

<style>
  :root{
    --pink:#e78da8;
    --pink-dark:#c96f8b;
    --brown:#6b493b;
    --cream:rgba(255,248,244,.94);
    --line:#efb7c1;
  }

  *{box-sizing:border-box}

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
  }

  body{
    font-family:"Trebuchet MS",Arial,sans-serif;
    color:var(--brown);
    background:#f8d7dc;
  }

  /* The illustration is the ONLY background. It is never cropped. */
  .page{
    width:min(100%,1024px);
    margin:0 auto;
    position:relative;
    background-image:url("planner-bg.png");
    background-repeat:no-repeat;
    background-position:top center;
    background-size:100% auto;
    padding:0 9.5% 170px;
    min-height:1536px;
  }

  .top-space{
    height:355px;
  }

  .controls{
    display:flex;
    gap:12px;
    align-items:center;
    margin:0 0 22px;
    position:relative;
    z-index:2;
  }

  .date{
    width:190px;
    height:54px;
    border:2px solid #efaebb;
    border-radius:16px;
    background:rgba(255,250,247,.96);
    color:var(--brown);
    padding:0 12px;
    font-size:17px;
    outline:none;
  }

  .task-input{
    flex:1;
    min-width:0;
    height:54px;
    border:2px solid #efaebb;
    border-radius:16px;
    background:rgba(255,250,247,.96);
    color:var(--brown);
    padding:0 17px;
    font-size:17px;
    outline:none;
  }

  button{
    font:inherit;
  }

  .add{
    height:54px;
    padding:0 23px;
    border:0;
    border-radius:16px;
    background:var(--pink);
    color:white;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 5px 12px rgba(160,90,110,.18);
  }

  .add:active{transform:scale(.98)}

  .progress-wrap{
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 15px;
    margin-bottom:14px;
    border:1.5px solid #efb6c0;
    border-radius:18px;
    background:rgba(255,249,246,.90);
  }

  .progress-text{
    white-space:nowrap;
    font-weight:bold;
  }

  .bar{
    height:10px;
    flex:1;
    background:#f0d9dd;
    border-radius:20px;
    overflow:hidden;
  }

  .fill{
    height:100%;
    width:0;
    background:var(--pink);
    border-radius:20px;
    transition:width .25s;
  }

  .tasks{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  /* Every added task creates another square/card INSIDE the paper. */
  .task{
    min-height:58px;
    display:grid;
    grid-template-columns:42px 1fr 40px;
    align-items:center;
    gap:9px;
    padding:7px 10px;
    border:1.5px solid #efb4bf;
    border-radius:16px;
    background:rgba(255,249,246,.92);
    box-shadow:0 3px 8px rgba(120,70,80,.07);
  }

  .num{
    width:38px;
    height:38px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:#e891aa;
    color:white;
    font-weight:bold;
  }

  .check{
    width:25px;
    height:25px;
    accent-color:var(--pink);
    cursor:pointer;
  }

  .task-main{
    min-width:0;
    display:flex;
    align-items:center;
    gap:8px;
  }

  .task-main .check{
    flex:0 0 auto;
  }

  .text{
    width:100%;
    min-width:0;
    border:0;
    border-bottom:1px dashed rgba(225,148,162,.55);
    background:transparent;
    color:var(--brown);
    padding:7px 5px;
    outline:none;
    font-size:16px;
  }

  .text:focus{
    background:rgba(255,255,255,.55);
    border-radius:7px;
  }

  .delete{
    width:34px;
    height:34px;
    border:0;
    border-radius:10px;
    background:rgba(255,255,255,.72);
    color:#c9778b;
    cursor:pointer;
    font-size:22px;
  }

  .done .text{
    text-decoration:line-through;
    opacity:.55;
  }

  .empty{
    text-align:center;
    padding:16px;
    color:#9c756a;
    background:rgba(255,249,246,.82);
    border-radius:16px;
    border:1.5px dashed #efb4bf;
  }

  .toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translate(-50%,20px);
    opacity:0;
    pointer-events:none;
    background:var(--pink);
    color:white;
    padding:11px 19px;
    border-radius:22px;
    transition:.25s;
    box-shadow:0 6px 18px rgba(100,50,60,.22);
  }

  .toast.show{
    opacity:1;
    transform:translate(-50%,0);
  }

  @media(max-width:700px){
    .page{
      padding-left:7%;
      padding-right:7%;
      min-height:1100px;
    }

    .top-space{
      height:235px;
    }

    .controls{
      flex-wrap:wrap;
    }

    .date{
      width:100%;
    }

    .task-input{
      min-width:calc(100% - 90px);
    }

    .add{
      padding:0 16px;
    }

    .progress-wrap{
      align-items:flex-start;
      flex-direction:column;
    }

    .bar{
      width:100%;
      flex:none;
    }
  }

  @media(max-width:430px){
    .page{
      padding-left:5.5%;
      padding-right:5.5%;
    }

    .top-space{
      height:190px;
    }

    .task{
      grid-template-columns:35px 1fr 32px;
      gap:6px;
      padding:6px;
    }

    .num{
      width:32px;
      height:32px;
      font-size:13px;
    }

    .text{
      font-size:14px;
    }
  }
</style>
</head>

<body>
<main class="page">
  <div class="top-space"></div>

  <section class="controls">
    <input id="date" class="date" type="date" aria-label="Choose date">
    <input id="taskInput" class="task-input" type="text" maxlength="120"
           placeholder="Write a task...">
    <button id="add" class="add">Add</button>
  </section>

  <section class="progress-wrap">
    <div id="progressText" class="progress-text">0 / 0 tasks completed</div>
    <div class="bar"><div id="fill" class="fill"></div></div>
  </section>

  <section id="tasks" class="tasks"></section>
</main>

<div id="toast" class="toast">Task completed</div>

<script>
  const TASK_KEY = "houdaPlannerV3Tasks";
  const DATE_KEY = "houdaPlannerV3Date";

  const tasksEl = document.getElementById("tasks");
  const taskInput = document.getElementById("taskInput");
  const dateEl = document.getElementById("date");
  const addBtn = document.getElementById("add");
  const progressText = document.getElementById("progressText");
  const fill = document.getElementById("fill");
  const toast = document.getElementById("toast");

  let tasks = JSON.parse(localStorage.getItem(TASK_KEY) || "[]");

  dateEl.value =
    localStorage.getItem(DATE_KEY) ||
    new Date().toISOString().slice(0,10);

  dateEl.addEventListener("change", () => {
    localStorage.setItem(DATE_KEY, dateEl.value);
  });

  function save(){
    localStorage.setItem(TASK_KEY, JSON.stringify(tasks));
  }

  function render(){
    tasksEl.innerHTML = "";

    if(tasks.length === 0){
      tasksEl.innerHTML =
        '<div class="empty">Add your first task</div>';
    }

    tasks.forEach((task,index)=>{
      const row = document.createElement("article");
      row.className = "task" + (task.done ? " done" : "");

      const number = document.createElement("div");
      number.className = "num";
      number.textContent = index + 1;

      const main = document.createElement("div");
      main.className = "task-main";

      const check = document.createElement("input");
      check.className = "check";
      check.type = "checkbox";
      check.checked = !!task.done;

      const text = document.createElement("input");
      text.className = "text";
      text.type = "text";
      text.maxLength = 120;
      text.value = task.text || "";
      text.placeholder = "Task...";

      const del = document.createElement("button");
      del.className = "delete";
      del.type = "button";
      del.textContent = "×";
      del.title = "Delete";

      check.addEventListener("change",()=>{
        task.done = check.checked;
        save();
        render();
        if(task.done) showToast();
      });

      text.addEventListener("input",()=>{
        task.text = text.value;
        save();
      });

      del.addEventListener("click",()=>{
        tasks.splice(index,1);
        save();
        render();
      });

      main.append(check,text);
      row.append(number,main,del);
      tasksEl.append(row);
    });

    const completed = tasks.filter(t=>t.done).length;
    progressText.textContent =
      `${completed} / ${tasks.length} tasks completed`;

    fill.style.width =
      tasks.length ? `${completed / tasks.length * 100}%` : "0%";
  }

  function addTask(){
    const value = taskInput.value.trim();
    if(!value) return;

    tasks.push({
      text:value,
      done:false,
      date:dateEl.value
    });

    taskInput.value = "";
    save();
    render();
    taskInput.focus();
  }

  addBtn.addEventListener("click",addTask);

  taskInput.addEventListener("keydown",(e)=>{
    if(e.key === "Enter") addTask();
  });

  function showToast(){
    toast.classList.add("show");
    setTimeout(()=>toast.classList.remove("show"),1300);
  }

  render();

  if("serviceWorker" in navigator){
    window.addEventListener("load",()=>{
      navigator.serviceWorker.register("./sw.js").catch(()=>{});
    });
  }
</script>
</body>
</html>
