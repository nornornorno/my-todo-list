<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TO DO LIST</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#9b62ad">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    padding: 30px 15px;

    background:
        linear-gradient(135deg, #faf7fc, #f3eafa);

    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    display: flex;
    justify-content: center;
    align-items: flex-start;

    transition: background-image 0.5s ease;
}

.container {
    width: 100%;
    max-width: 600px;

    margin-top: 30px;
    padding: 30px;

    background: rgba(255,255,255,0.94);

    border-radius: 28px;

    box-shadow:
        0 15px 40px rgba(80,50,90,0.15);
}

h1 {
    text-align: center;

    color: #7b4b8a;

    margin-bottom: 28px;

    font-size: 32px;

    letter-spacing: 1px;
}

.date-area {
    margin-bottom: 20px;
}

.date-area label {
    display: block;

    color: #4d3b52;

    margin-bottom: 8px;

    font-size: 16px;
}

#dateInput {
    width: 100%;

    padding: 13px;

    border: 2px solid #d9b8e5;

    border-radius: 13px;

    font-size: 16px;

    outline: none;

    background: white;
}

#dateInput:focus,
#taskInput:focus {
    border-color: #9b62ad;

    box-shadow:
        0 0 0 3px rgba(155,98,173,0.10);
}

.input-area {
    display: flex;

    gap: 10px;

    margin-bottom: 22px;
}

#taskInput {
    flex: 1;

    min-width: 0;

    padding: 14px;

    border: 2px solid #d9b8e5;

    border-radius: 13px;

    font-size: 16px;

    outline: none;
}

#addBtn {
    border: none;

    background: #9b62ad;

    color: white;

    padding: 0 22px;

    border-radius: 13px;

    font-size: 16px;

    cursor: pointer;

    transition: 0.2s;
}

#addBtn:hover {
    background: #7b4b8a;

    transform: translateY(-1px);
}

#taskList {
    list-style: none;
}

.task {
    display: flex;

    align-items: center;

    gap: 12px;

    background: #fff9ff;

    border: 1px solid #ead4ef;

    border-radius: 15px;

    padding: 14px;

    margin-bottom: 11px;

    animation: taskAppear 0.3s ease;

    transition:
        transform 0.2s,
        box-shadow 0.2s;
}

.task:hover {
    transform: translateY(-2px);

    box-shadow:
        0 5px 15px rgba(100,60,110,0.08);
}

.task input[type="checkbox"] {
    width: 22px;
    height: 22px;

    cursor: pointer;

    accent-color: #9b62ad;

    flex-shrink: 0;
}

.task-text {
    flex: 1;

    font-size: 17px;

    color: #4d3b52;

    overflow-wrap: anywhere;

    transition: 0.3s;
}

.task.completed {
    background: #f8f0fa;

    transform: scale(0.99);
}

.task.completed .task-text {
    text-decoration: line-through;

    opacity: 0.45;
}

.delete-btn {
    border: none;

    background: #f0a2b5;

    color: white;

    padding: 8px 12px;

    border-radius: 9px;

    cursor: pointer;

    transition: 0.2s;

    flex-shrink: 0;
}

.delete-btn:hover {
    background: #df7f98;

    transform: scale(1.03);
}

.empty-message {
    text-align: center;

    color: #8b7092;

    padding: 22px 0 5px;

    font-size: 15px;
}

.celebration {
    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    display: flex;

    justify-content: center;
    align-items: center;

    background: rgba(255,255,255,0.30);

    backdrop-filter: blur(4px);

    z-index: 1000;

    animation: fadeIn 0.25s ease;
}

.celebration-box {
    width: 290px;

    padding: 32px 25px;

    text-align: center;

    background: white;

    border: 1px solid #ead4ef;

    border-radius: 25px;

    box-shadow:
        0 18px 45px rgba(80,50,90,0.20);

    animation: popUp 0.4s ease;
}

.celebration-line {
    width: 45px;
    height: 3px;

    background: #9b62ad;

    margin: 0 auto 18px;

    border-radius: 10px;
}

.celebration-box h2 {
    color: #7b4b8a;

    font-size: 23px;

    margin-bottom: 8px;
}

.celebration-box p {
    color: #8b7092;

    font-size: 15px;
}


/* BACKGROUND BUTTON */

#backgroundBtn {
    position: fixed;

    top: 20px;
    right: 20px;

    border: none;

    background: rgba(255,255,255,0.92);

    color: #7b4b8a;

    padding: 11px 16px;

    border-radius: 12px;

    cursor: pointer;

    font-size: 14px;

    box-shadow:
        0 5px 15px rgba(80,50,90,0.15);

    z-index: 20;

    transition: 0.2s;
}

#backgroundBtn:hover {
    transform: translateY(-2px);

    box-shadow:
        0 7px 18px rgba(80,50,90,0.20);
}


/* ANIMATIONS */

@keyframes taskAppear {

    from {
        opacity: 0;

        transform: translateY(8px);
    }

    to {
        opacity: 1;

        transform: translateY(0);
    }

}

@keyframes fadeIn {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }

}

@keyframes popUp {

    from {
        opacity: 0;

        transform: scale(0.85);
    }

    to {
        opacity: 1;

        transform: scale(1);
    }

}


/* MOBILE */

@media (max-width: 480px) {

    body {
        padding: 15px 10px;
    }

    .container {
        margin-top: 60px;

        padding: 20px;

        border-radius: 22px;
    }

    h1 {
        font-size: 27px;
    }

    .input-area {
        flex-direction: column;
    }

    #addBtn {
        height: 48px;
    }

    .task {
        padding: 12px;
    }

    .task-text {
        font-size: 16px;
    }

    .delete-btn {
        padding: 7px 9px;
    }

    #backgroundBtn {
        top: 12px;
        right: 12px;

        padding: 9px 12px;

        font-size: 13px;
    }

}

</style>

</head>


<body>


<!-- HIDDEN IMAGE SELECTOR -->

<input
    type="file"
    id="backgroundInput"
    accept="image/*"
    hidden
>


<!-- BACKGROUND BUTTON -->

<button id="backgroundBtn">
    🖼️ تغيير الخلفية
</button>


<div class="container">

    <h1>TO DO LIST</h1>


    <div class="date-area">

        <label for="dateInput">
            Date
        </label>

        <input
            type="date"
            id="dateInput"
        >

    </div>


    <div class="input-area">

        <input
            type="text"
            id="taskInput"
            placeholder="Add a task..."
        >

        <button id="addBtn">
            Add
        </button>

    </div>


    <ul id="taskList"></ul>


    <p
        class="empty-message"
        id="emptyMessage"
    >
        No tasks yet
    </p>

</div>


<script>


/* ELEMENTS */

const taskInput =
    document.getElementById("taskInput");

const addBtn =
    document.getElementById("addBtn");

const taskList =
    document.getElementById("taskList");

const emptyMessage =
    document.getElementById("emptyMessage");

const dateInput =
    document.getElementById("dateInput");


/* BACKGROUND ELEMENTS */

const backgroundInput =
    document.getElementById("backgroundInput");

const backgroundBtn =
    document.getElementById("backgroundBtn");



/* LOAD SAVED TASKS */

let tasks =
    JSON.parse(
        localStorage.getItem("houdaTasks")
    ) || [];



/* SAVE TASKS */

function saveTasks() {

    localStorage.setItem(
        "houdaTasks",
        JSON.stringify(tasks)
    );

}



/* UPDATE EMPTY MESSAGE */

function updateEmptyMessage() {

    if (tasks.length === 0) {

        emptyMessage.style.display =
            "block";

    } else {

        emptyMessage.style.display =
            "none";

    }

}



/* CELEBRATION */

function celebrate() {

    const celebration =
        document.createElement("div");

    celebration.className =
        "celebration";

    celebration.innerHTML = `

        <div class="celebration-box">

            <div class="celebration-line"></div>

            <h2>
                Task Completed
            </h2>

            <p>
                Well done!
            </p>

        </div>

    `;

    document.body.appendChild(
        celebration
    );


    setTimeout(function() {

        celebration.style.opacity =
            "0";

        celebration.style.transition =
            "opacity 0.5s ease";

    }, 1200);


    setTimeout(function() {

        celebration.remove();

    }, 1700);

}



/* DISPLAY TASKS */

function renderTasks() {

    taskList.innerHTML = "";


    tasks.forEach(function(task) {

        const li =
            document.createElement("li");

        li.className =
            "task";


        if (task.completed) {

            li.classList.add(
                "completed"
            );

        }



        const checkbox =
            document.createElement("input");

        checkbox.type =
            "checkbox";

        checkbox.checked =
            task.completed;



        const text =
            document.createElement("span");

        text.className =
            "task-text";

        text.textContent =
            task.text;



        const deleteBtn =
            document.createElement("button");

        deleteBtn.className =
            "delete-btn";

        deleteBtn.textContent =
            "Delete";



        /* CHECKBOX */

        checkbox.addEventListener(
            "change",
            function() {

                task.completed =
                    checkbox.checked;


                if (checkbox.checked) {

                    li.classList.add(
                        "completed"
                    );

                    celebrate();

                } else {

                    li.classList.remove(
                        "completed"
                    );

                }


                saveTasks();

            }
        );



        /* DELETE */

        deleteBtn.addEventListener(
            "click",
            function() {

                tasks =
                    tasks.filter(
                        function(item) {

                            return item.id !==
                                task.id;

                        }
                    );


                saveTasks();

                renderTasks();

            }
        );



        li.appendChild(
            checkbox
        );

        li.appendChild(
            text
        );

        li.appendChild(
            deleteBtn
        );


        taskList.appendChild(
            li
        );

    });


    updateEmptyMessage();

}



/* ADD TASK */

function addTask() {

    const taskText =
        taskInput.value.trim();


    if (taskText === "") {

        return;

    }


    const newTask = {

        id:
            Date.now(),

        text:
            taskText,

        completed:
            false,

        date:
            dateInput.value

    };


    tasks.push(
        newTask
    );


    saveTasks();

    renderTasks();


    taskInput.value = "";

    taskInput.focus();

}



/* ADD BUTTON */

addBtn.addEventListener(
    "click",
    addTask
);



/* ENTER KEY */

taskInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            addTask();

        }

    }
);



/* CHANGE BACKGROUND */

backgroundBtn.addEventListener(
    "click",
    function() {

        backgroundInput.click();

    }
);



/* SELECT IMAGE */

backgroundInput.addEventListener(
    "change",
    function() {

        const file =
            backgroundInput.files[0];


        if (!file) {

            return;

        }


        const reader =
            new FileReader();


        reader.onload =
            function(event) {

                const image =
                    event.target.result;


                /* APPLY BACKGROUND */

                document.body.style.backgroundImage =
                    `url("${image}")`;

                document.body.style.backgroundSize =
                    "cover";

                document.body.style.backgroundPosition =
                    "center";

                document.body.style.backgroundAttachment =
                    "fixed";


                /* SAVE BACKGROUND */

                localStorage.setItem(
                    "houdaBackground",
                    image
                );

            };


        reader.readAsDataURL(file);

    }
);



/* LOAD SAVED BACKGROUND */

const savedBackground =
    localStorage.getItem(
        "houdaBackground"
    );


if (savedBackground) {

    document.body.style.backgroundImage =
        `url("${savedBackground}")`;

    document.body.style.backgroundSize =
        "cover";

    document.body.style.backgroundPosition =
        "center";

    document.body.style.backgroundAttachment =
        "fixed";

}



/* START */

renderTasks();



/* SERVICE WORKER */

if ("serviceWorker" in navigator) {

    window.addEventListener(
        "load",
        function() {

            navigator.serviceWorker.register(
                "./sw.js"
            );

        }
    );

}

</script>

</body>

</html>
