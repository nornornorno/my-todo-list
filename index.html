<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#e98fa8">
<link rel="manifest" href="manifest.json">
<title>TO-DO LIST</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:#f8d9de;
  font-family:"Trebuchet MS",Arial,sans-serif;
  color:#654738;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}
.app{
  width:min(100vw,760px);
  margin:0 auto;
  position:relative;
}
.bg{
  width:100%;
  height:auto;
  display:block;
  user-select:none;
  pointer-events:none;
}
.content{
  position:absolute;
  top:34.5%;
  left:9%;
  width:82%;
  padding:2% 4% 6%;
}
.topbar{
  display:flex;
  gap:10px;
  margin-bottom:12px;
}
.date,.new-task{
  border:2px solid #efacb8;
  background:rgba(255,250,247,.92);
  color:#69493c;
  border-radius:14px;
  height:44px;
  padding:0 12px;
  font-size:16px;
  outline:none;
  box-shadow:0 3px 10px rgba(150,90,100,.08);
}
.date{width:180px}
.new-task{flex:1;min-width:0}
.add{
  border:0;border-radius:14px;
  background:#e98fa8;color:white;
  font-weight:bold;font-size:16px;
  padding:0 18px;cursor:pointer;
  box-shadow:0 4px 10px rgba(150,80,95,.18)
}
.add:active{transform:scale(.98)}
.progress{
  display:flex;align-items:center;gap:10px;
  margin:0 0 12px;
  padding:9px 13px;
  border:2px solid #efc1c8;
  border-radius:15px;
  background:rgba(255,250,247,.88);
  font-size:14px;
}
.bar{height:8px;flex:1;background:#f0d6db;border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;background:#e98fa8;border-radius:99px;transition:.25s}
.tasks{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px;
}
.card{
  min-height:55px;
  display:flex;align-items:center;gap:8px;
  padding:7px 9px;
  background:rgba(255,250,247,.91);
  border:2px solid #efc0c8;
  border-radius:15px;
  box-shadow:0 3px 9px rgba(130,70,80,.07);
}
.card input[type=checkbox]{
  width:23px;height:23px;flex:0 0 auto;
  accent-color:#d87998;cursor:pointer
}
.card .number{
  width:28px;height:28px;flex:0 0 auto;
  display:grid;place-items:center;
  border-radius:50%;
  background:#e8a0b5;color:white;font-weight:bold;font-size:13px
}
.text{
  min-width:0;flex:1;
  border:0;background:transparent;
  color:#654738;font-size:14px;outline:none
}
.done .text{text-decoration:line-through;opacity:.5}
.delete{
  border:0;background:transparent;color:#bf7b89;
  font-size:21px;cursor:pointer;padding:0 3px
}
.empty{
  grid-column:1/-1;
  text-align:center;padding:12px;
  color:#9a7770;font-size:13px;
}
.notice{
  position:fixed;left:50%;bottom:20px;
  transform:translate(-50%,20px);
  opacity:0;pointer-events:none;
  background:#e98fa8;color:white;
  padding:10px 18px;border-radius:22px;
  transition:.25s;z-index:10
}
.notice.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){
  .content{top:34.5%;left:8%;width:84%;padding-left:3%;padding-right:3%}
  .topbar{gap:6px}
  .date,.new-task,.add{height:38px;font-size:13px}
  .date{width:130px}
  .add{padding:0 12px}
  .tasks{grid-template-columns:1fr;gap:7px}
  .card{min-height:48px;padding:6px 8px}
  .text{font-size:13px}
}
</style>
</head>
<body>
<div class="app">
  <img class="bg" src="planner-bg.png" alt="To-Do List planner background">

  <div class="content">
    <div class="topbar">
      <input id="date" class="date" type="date" aria-label="Date">
      <input id="newTask" class="new-task" type="text" maxlength="120" placeholder="Write a task...">
      <button id="add" class="add">Add</button>
    </div>

    <div class="progress">
      <span id="count">0 / 0 completed</span>
      <div class="bar"><div id="fill" class="fill"></div></div>
    </div>

    <div id="tasks" class="tasks"></div>
  </div>
</div>

<div id="notice" class="notice">Task completed</div>

<script>
const TASKS_KEY="houdaPlannerTasksV2";
const DATE_KEY="houdaPlannerDateV2";
const dateEl=document.getElementById("date");
const input=document.getElementById("newTask");
const tasksEl=document.getElementById("tasks");
const countEl=document.getElementById("count");
const fillEl=document.getElementById("fill");
const notice=document.getElementById("notice");

let tasks=JSON.parse(localStorage.getItem(TASKS_KEY)||"[]");
dateEl.value=localStorage.getItem(DATE_KEY)||new Date().toISOString().slice(0,10);

dateEl.addEventListener("change",()=>localStorage.setItem(DATE_KEY,dateEl.value));

function save(){localStorage.setItem(TASKS_KEY,JSON.stringify(tasks));}

function render(){
  tasksEl.innerHTML="";
  if(!tasks.length){
    const e=document.createElement("div");
    e.className="empty";
    e.textContent="Add your first task above.";
    tasksEl.appendChild(e);
  }

  tasks.forEach((task,i)=>{
    const card=document.createElement("div");
    card.className="card"+(task.done?" done":"");

    const num=document.createElement("div");
    num.className="number";
    num.textContent=i+1;

    const check=document.createElement("input");
    check.type="checkbox";
    check.checked=task.done;
    check.setAttribute("aria-label","Complete task");

    const text=document.createElement("input");
    text.className="text";
    text.value=task.text;
    text.maxLength=120;
    text.setAttribute("aria-label","Task text");

    const del=document.createElement("button");
    del.className="delete";
    del.textContent="×";
    del.title="Delete task";

    check.onchange=()=>{
      task.done=check.checked;
      save(); render();
      if(task.done) showNotice("Task completed");
    };
    text.oninput=()=>{
      task.text=text.value;
      save();
    };
    del.onclick=()=>{
      tasks.splice(i,1);
      save(); render();
    };

    card.append(num,check,text,del);
    tasksEl.appendChild(card);
  });

  const completed=tasks.filter(t=>t.done).length;
  countEl.textContent=`${completed} / ${tasks.length} completed`;
  fillEl.style.width=tasks.length ? `${completed/tasks.length*100}%` : "0%";
}

function addTask(){
  const value=input.value.trim();
  if(!value) return;
  tasks.push({text:value,done:false});
  input.value="";
  save(); render(); input.focus();
}
document.getElementById("add").onclick=addTask;
input.addEventListener("keydown",e=>{if(e.key==="Enter")addTask()});

function showNotice(t){
  notice.textContent=t;
  notice.classList.add("show");
  setTimeout(()=>notice.classList.remove("show"),1200);
}

render();

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
</body>
</html>
